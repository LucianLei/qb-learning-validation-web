"use strict";

const labels = {3:"熟练掌握",2:"基本达标",1:"仍需辅导"};
const english = {3:"Talented",2:"Skilled",1:"Less Skilled"};
const app = document.querySelector("#app");
const reviewTab = document.querySelector("#reviewTab");
const adminTab = document.querySelector("#adminTab");
const demo = document.documentElement.dataset.mode === "demo";
const feishu = document.documentElement.dataset.mode === "feishu";
const shortcutMode = document.documentElement.dataset.mode === "shortcut";
const shortcutParams = new URLSearchParams(location.search);
const shortcutName = shortcutParams.get("shortcut") || "QB 学习验收";
const shortcutRelease = {version: 2, url: "https://www.icloud.com/shortcuts/6c5e3e03dab841b19a6ca15b3cacb036"};
const signOut = document.querySelector("#signOut");
const demoKey = "qb-validation-offline-v1";
const sample = {admin:true,reviewer:"演示导师",learners:[{id:"sample-1",name:"示例同事 A"},{id:"sample-2",name:"示例同事 B"}],reviews:[
  {id:"sample-r2",learner:"sample-1",module:2,scores:[3,2,1],note:"下次跟进 ISR 备注和商务探询。",reviewer:"演示导师",date:"2026-11-14T04:00:00Z"},
  {id:"sample-r1",learner:"sample-1",module:1,scores:[3,3,3],note:"演示流程完整。",reviewer:"演示导师",date:"2026-11-13T04:00:00Z"}
]};
let data, view = "review", moduleId = 1, learnerId = "", detailId = "", filter = "", notice = "", noticeError = false, pending = false;
const drafts = new Map();
const shortcutDraftKey = "qb-validation-shortcut-draft-v1";
let shortcutResult = null;
function loadShortcutDraft() {
  try { return JSON.parse(sessionStorage.getItem(shortcutDraftKey)); }
  catch { return null; }
}
function saveShortcutDraft() {
  if (!shortcutMode) return;
  try {
    sessionStorage.setItem(shortcutDraftKey,JSON.stringify({
      learnerId, reviewer:data.reviewer, moduleId, drafts:[...drafts], result:shortcutResult
    }));
  } catch {}
}
function savedReviewer() {
  try { return localStorage.getItem("qb-shortcut-reviewer") || ""; }
  catch { return ""; }
}
function localId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  bytes[6] = (bytes[6] & 15) | 64;
  bytes[8] = (bytes[8] & 63) | 128;
  return Array.from(bytes, x=>x.toString(16).padStart(2,"0")).join("").replace(/^(........)(....)(....)(....)/,"$1-$2-$3-$4-");
}
const esc = (x = "") => String(x).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const moduleOf = id => catalog.find(m => m.id === id);
const draftKey = () => shortcutMode ? moduleId : learnerId + ":" + moduleId;
const draft = () => {
  const key = draftKey();
  if (!drafts.has(key)) drafts.set(key,{scores:[0,0,0],note:"",request:null});
  return drafts.get(key);
};
const status = scores => scores.includes(1) ? "需针对性辅导" : scores.every(n => n === 3) ? "优秀通关" : "合格通关";
const total = scores => scores.reduce((a,b) => a+b,0);
const date = t => new Intl.DateTimeFormat("zh-CN",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Shanghai"}).format(new Date(t));
const pill = row => row ? '<span class="pill '+(row.scores.includes(1)?"help":"good")+'">'+status(row.scores)+'</span>' : '<span class="pill">未验收</span>';
const count = id => {
  const latest = catalog.map(m => data.reviews.find(r => r.learner === id && r.module === m.id)).filter(Boolean);
  return {reviewed:latest.length,passed:latest.filter(r => !r.scores.includes(1)).length,help:latest.filter(r => r.scores.includes(1)).length,items:latest.reduce((n,r) => n+r.scores.filter(s => s >= 2).length,0)};
};

  return (demo ? '<span class="sample">离线演示 · 示例记录仅保存在当前浏览器</span>' : '')+

function message() {
  return '<output class="notice '+(noticeError?"error":"")+'" id="notice" aria-live="polite">'+esc(notice)+'</output>';
}

    output.textContent = text;
    output.classList.toggle("error",isError);
  }

async function request(path, payload) {
  const response = await fetch(path,payload ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)} : undefined);
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw Object.assign(new Error(result.message || "暂时无法连接数据，请重试。"), {status:response.status});
  return result;
}
async function load() {
  if (shortcutMode) return {admin:false,reviewer:savedReviewer(),learners:[],reviews:[]};
  if (!demo) return request("/api/state");
  try { return JSON.parse(localStorage.getItem(demoKey)) || structuredClone(sample); }
  catch { return structuredClone(sample); }
}
function saveLocal(candidate) {
  try { localStorage.setItem(demoKey,JSON.stringify(candidate)); }

  data = candidate;
}
function shortcutUpdateNotice() {
  if (!shortcutMode || !shortcutRelease) return "";
  const current = Number(shortcutParams.get("shortcutVersion")) || 1;
  if (current >= shortcutRelease.version) return "";
  let link;
  try { link = new URL(shortcutRelease.url); }
  catch { return ""; }
  if (link.origin !== "https://www.icloud.com" || !/^\/shortcuts\/[a-f0-9]{32}\/?$/i.test(link.pathname)) return "";
  const text = shortcutParams.has("shortcut") || shortcutParams.has("shortcutVersion")
    ? "新版快捷指令可用。导入时请替换同名快捷指令。"
    : "首次使用或需要更新时，请获取最新的快捷指令。";
  return '<aside class="section pane" aria-label="快捷指令更新">'+text+
    ' <a class="secondary" href="'+esc(link.href)+'" target="_blank" rel="noopener noreferrer">获取 v'+esc(shortcutRelease.version)+'</a></aside>';
}
function renderReview() {
  const m = moduleOf(moduleId);
  const d = draft();
  const options = data.learners.map(p => '<option value="'+esc(p.id)+'" '+(p.id === learnerId?"selected":"")+'>'+esc(feishu ? p.name+" · "+p.id : p.name)+'</option>').join("");

    '<section class="section"><h2>选择验收模块</h2><div class="grid">'+catalog.map(mod =>

    '</div></section><section class="section pane" id="scorePanel"><div class="form-head"><div><span class="sub">'+m.area+'</span><h2>'+m.name+'</h2></div>'+learnerField+'</div>'+
    (shortcutMode ? '<label class="section">验收导师<input id="reviewerName" form="reviewForm" maxlength="60" autocomplete="name" placeholder="输入你的姓名" value="'+esc(data.reviewer)+'" required></label>' : '')+
    (!shortcutMode && !options ? '<div class="empty">'+(data.admin?'请先在管理后台添加新同事。':'名册暂无新同事，请联系管理员。')+'</div>' : '')+
    '<form id="reviewForm"'+(shortcutMode?' novalidate':'')+'>'+m.items.map(([name,...criteria],i) =>
      '<section class="item"><div class="item-title"><span class="token">'+m.id+'.'+(i+1)+'</span><h3 id="item-'+i+'">'+name+'</h3></div><ul class="criteria">'+criteria.map(c=>'<li>'+c+'</li>').join("")+'</ul><div class="ratings" role="group" aria-labelledby="item-'+i+'">'+[3,2,1].map(n =>
      '<button class="rating" type="button" data-item="'+i+'" data-score="'+n+'" aria-label="'+labels[n]+'，'+n+' 分" aria-pressed="'+(d.scores[i] === n)+'">'+labels[n]+'<span>'+n+' 分 · '+english[n]+'</span></button>').join("")+'</div></section>').join("")+
    '<label>辅导备注 <span class="sub">可选</span><textarea id="note" maxlength="1000" placeholder="记录做得好的地方，或下次复验要观察的行为">'+esc(d.note)+'</textarea></label>'+
    '<div class="actions"><span class="sub" id="progress" aria-live="polite"></span><button type="submit" class="primary" id="submitReview">'+(shortcutMode?'生成验收结果':'提交验收')+'</button></div>'+message()+'</form></section>';
  updateReview();
}
function updateReview() {
  const {scores} = draft();
  const rated = scores.filter(Boolean).length;
  document.querySelector("#progress").textContent = rated === 3 ? total(scores)+" / 9 分 · "+status(scores) : "已评分 "+rated+" / 3 项";
  document.querySelector("#submitReview").disabled = pending || (!shortcutMode && (!learnerId || rated !== 3));
}
function historyItem(row) {
  const m = moduleOf(row.module);
  const weak = m.items.filter((_,i) => row.scores[i] === 1).map(i => i[0]);
  return '<article><div class="meta">'+date(row.date)+' · '+esc(row.reviewer)+'</div>'+
    row.scores.map((n,i) => '<div class="result-line"><span>'+m.id+'.'+(i+1)+' '+m.items[i][0]+'</span><strong>'+n+' 分 · '+labels[n]+'</strong></div>').join("")+
    (weak.length ? '<p class="note"><strong>待加强</strong> '+weak.join('、')+'</p>' : '')+
    (row.note ? '<p class="note"><strong>导师备注</strong> '+esc(row.note)+'</p>' : '')+'</article>';
}
function personList() {
  const people = data.learners.filter(p => p.name.toLowerCase().includes(filter.trim().toLowerCase()));
  return people.map(p => '<button type="button" class="person" data-person="'+esc(p.id)+'" aria-pressed="'+(p.id===detailId)+'"><b>'+esc(p.name)+'</b><span class="sub">'+count(p.id).passed+' / 6 通关</span></button>').join("") ||
    '<div class="empty">'+(data.learners.length ? "没有匹配的同事。" : "添加第一位新同事后即可开始验收。")+'</div>';
}
function renderAdmin() {
  if (!data.learners.some(p => p.id === detailId)) detailId = data.learners[0]?.id || "";
  const person = data.learners.find(p=>p.id===detailId);
  const numbers = count(detailId);
  const details = person ? catalog.map(m => {
    const rows = data.reviews.filter(r=>r.learner===detailId && r.module===m.id);
    const latest = rows[0];
    return '<details><summary><strong>'+m.name+'</strong>'+pill(latest)+'<span class="sub push">'+(latest?total(latest.scores)+' / 9 分':'—')+'</span></summary><div class="detail">'+
      (latest ? historyItem(latest) : '<div class="empty">'+m.items.map((item,i)=>'<div class="result-line"><span>'+m.id+'.'+(i+1)+' '+item[0]+'</span><span>未验收</span></div>').join('')+'</div>')+
      (rows.length>1?'<div class="history"><h3>历史验收</h3>'+rows.slice(1).map(r=>'<div class="meta">'+pill(r)+' '+total(r.scores)+' / 9 分</div>'+historyItem(r)).join("")+'</div>':'')+'</div></details>';
  }).join("") : '<div class="empty">名册中有同事后，这里会显示 6 个模块的验收明细。</div>';
  app.innerHTML = hero("学习进度","查看每位新同事的通关情况、辅导项和复验记录。")+
    '<div class="section dashboard-grid"><aside class="pane"><h2>新同事名册</h2><label class="visually-hidden" for="filter">搜索姓名</label><input type="search" id="filter" placeholder="搜索姓名" value="'+esc(filter)+'"><div class="roster" id="roster">'+personList()+'</div>'+
    '<form class="inline-form" id="addForm"><label>新增同事<input id="newName" maxlength="60" required placeholder="输入姓名"></label><button type="submit" class="secondary">添加</button></form>'+message()+'</aside>'+
    '<section class="pane"><h2 class="muteline">'+(person?esc(person.name):"个人明细")+'</h2>'+
    '<div class="stats"><div class="stat"><b>'+numbers.reviewed+'/6</b>已验收模块</div><div class="stat"><b>'+numbers.passed+'/6</b>已通关模块</div><div class="stat"><b>'+numbers.help+'</b>待辅导模块</div><div class="stat"><b>'+numbers.items+'/18</b>已达标细项</div></div>'+details+'</section></div>';
}
function render() {
  if (!data) return;
  if (!data.admin) view = "review";
  adminTab.hidden = !data.admin;
  signOut.hidden = !feishu;
  document.querySelector("#account").textContent = data.reviewer;
  reviewTab.setAttribute("aria-current",view === "review" ? "page" : "false");
  adminTab.setAttribute("aria-current",view === "admin" ? "page" : "false");
  if (view === "review" && shortcutResult) showShortcutReturn(shortcutResult);
  else if (view === "review") renderReview();
  else renderAdmin();
}
function navigate(next) {
  if (pending) return;
  view = next;
  notice = "";
  noticeError = false;
  render();
}
reviewTab.addEventListener("click",()=>navigate("review"));
adminTab.addEventListener("click",()=>navigate("admin"));
app.addEventListener("click",e=>{
  if (pending) return;
  const button = e.target.closest("button");
  if (!button) return;
  if (button.dataset.module) {
    moduleId = Number(button.dataset.module);
    saveShortcutDraft();
    showNotice("");
    renderReview();
    document.querySelector('[data-module="'+moduleId+'"]').focus({preventScroll:true});
  } else if (button.dataset.score) {
    const d = draft();
    d.scores[Number(button.dataset.item)] = Number(button.dataset.score);
    d.request = null;
    saveShortcutDraft();
    showNotice("");
    button.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===button));
    updateReview();
  } else if (button.dataset.person) {
    detailId = button.dataset.person;
    renderAdmin();
    Array.from(document.querySelectorAll("[data-person]")).find(b=>b.dataset.person===detailId)?.focus({preventScroll:true});
  }
});
app.addEventListener("change",e=>{
  if(e.target.id === "learner") {
    learnerId = e.target.value;
    showNotice("");
    renderReview();
    document.querySelector("#learner").focus({preventScroll:true});
  }
});
app.addEventListener("input",e=>{
  if(e.target.id === "note") {
    draft().note = e.target.value;
    draft().request = null;
  } else if(e.target.id === "learnerName") {
    learnerId = e.target.value;
  } else if(e.target.id === "reviewerName") {
    data.reviewer = e.target.value;
    try { localStorage.setItem("qb-shortcut-reviewer",data.reviewer); } catch {}
  } else if (e.target.id === "filter") {
    filter = e.target.value;
    document.querySelector("#roster").innerHTML = personList();
  }
  if (shortcutMode && ["note","learnerName","reviewerName"].includes(e.target.id)) saveShortcutDraft();
});
app.addEventListener("submit",async e=>{
  e.preventDefault();
  if (pending) return;
  if (e.target.id === "mentorLogin") return loginMentor(e.target);
  const isReview = e.target.id === "reviewForm";
  if (isReview && shortcutMode) {
    try { prepareShortcutResult(); }
    catch { showNotice("无法生成结果。你填写的内容仍在，请重试。",true); }
    return;
  }
  if (isReview && (!learnerId || draft().scores.some(n=>!n))) return;
  const name = isReview ? "" : document.querySelector("#newName").value.trim();
  if (!isReview && !name) return showNotice("请输入姓名。",true);
  pending = true;
  const form = e.target;
  const fields = [...form.elements,...document.querySelectorAll("#learner")].filter(el=>!el.disabled);
  fields.forEach(el=>el.disabled=true);
  showNotice("正在保存…");
  try {
    if (isReview) {
      const d = draft();
      d.request ??= {id:localId(),learner:learnerId,module:moduleId,scores:[...d.scores],note:d.note.trim()};
      if (demo) {
        const record = {...d.request,date:new Date().toISOString(),reviewer:data.reviewer};
        saveLocal({...data,reviews:[record,...data.reviews]});
      } else {
        await request("/api/reviews",d.request);
      }
      const result = "已提交 · "+total(d.scores)+" / 9 分 · "+status(d.scores);
      drafts.delete(draftKey());
      if (!feishu) { try { data = await load(); } catch {} }
      showNotice(result);
    } else {
      const person = {id:localId(),name};
      if (demo) saveLocal({...data,learners:[...data.learners,person]});
      else {
        await request("/api/learners",person);
        data = {...data,learners:[...data.learners,person]};
        try { data = await load(); } catch {}
      }
      detailId = person.id;
      filter = "";
      showNotice("已添加 "+name);
    }
    pending = false;
    render();
    document.querySelector("#notice")?.scrollIntoView({block:"nearest"});
  } catch(error) {
    pending = false;
    fields.forEach(el=>el.disabled=false);
    if (feishu && error.status === 401) return showLogin();
    showNotice(error.message || "保存失败，请重试。",true);
    if (isReview) updateReview();
  }
});
function prepareShortcutResult() {
  const learnerField = document.querySelector("#learnerName");
  const reviewerField = document.querySelector("#reviewerName");
  learnerId = learnerField.value;
  data.reviewer = reviewerField.value;
  const learner = learnerId.trim();
  const reviewer = data.reviewer.trim();
  const d = draft();
  const unrated = d.scores.findIndex(n => !n);
  const missing = !learner ? learnerField : !reviewer ? reviewerField :
    unrated < 0 ? null : document.querySelector('[data-item="'+unrated+'"]');
  if (missing) {
    const prompt = !learner ? "请填写新同事姓名。" : !reviewer ? "请填写验收导师姓名。" : "请为第 "+(unrated+1)+" 项评分。";
    saveShortcutDraft();
    showNotice(prompt,true);
    missing.focus();
    return;
  }
  const section = moduleOf(moduleId);
  const itemNames = section.items.map(item=>item[0]);
  const scores = [...d.scores];
  const scoreTotal = total(scores);
  const resultStatus = status(scores);
  d.note = document.querySelector("#note").value;
  const note = d.note.trim();
  const values = [reviewer,learner,section.id,section.name,itemNames[0],scores[0],itemNames[1],scores[1],itemNames[2],scores[2],scoreTotal,resultStatus,note];
  if (!d.payload || values.some((value,i) => value !== d.payload.row[i+2])) {
    const submissionId = localId();
    const submittedAt = new Date().toISOString();
    d.payload = {
      version:1,submissionId,submittedAt,reviewer,learner,
      moduleId:section.id,moduleName:section.name,itemNames,scores,total:scoreTotal,status:resultStatus,note,
      row:[submissionId,submittedAt,...values]
    };
  }
  notice = "";
  shortcutResult = d.payload;
  saveShortcutDraft();
  showShortcutReturn(shortcutResult);
  document.querySelector("#returnToShortcut").focus();
}
function showShortcutReturn(payload) {
  const encoded = JSON.stringify(payload);
  const shortcutURL = "shortcuts://run-shortcut?name="+encodeURIComponent(shortcutName);
  const callback = shortcutURL+"&input=text&text="+encodeURIComponent(encoded);
  app.innerHTML = hero("验收结果待写入","由快捷指令写入共享 Numbers 表格。")+
    '<section class="section pane" id="returnPanel"><span class="pill good">'+esc(payload.status)+'</span><h2 class="section">'+esc(payload.learner)+' · '+esc(payload.moduleName)+'</h2>'+
    '<div class="stats"><div class="stat"><b>'+payload.total+' / 9</b>模块总分</div><div class="stat"><b>'+esc(payload.reviewer)+'</b>验收导师</div></div>'+
    '<div class="actions"><a class="primary" id="returnToShortcut" href="'+esc(callback)+'">打开快捷指令并写入 Numbers</a></div>'+
    '<output class="notice" id="returnNotice" aria-live="polite">请到 Numbers 确认已新增记录。重试前可用提交编号查重。</output>'+
    '<p class="meta">提交编号 '+esc(payload.submissionId)+'</p>'+
    '<details><summary>打不开快捷指令？试用剪贴板</summary><div class="detail"><p class="sub">复制结果后，用剪贴板内容运行快捷指令。如果当前浏览器拦截跳转，请先复制结果备份，再从 Safari 打开网页。</p>'+
    '<label>结果代码<textarea id="resultCode" readonly rows="4"></textarea></label>'+
    '<div class="actions"><button type="button" class="secondary" id="copyResult">复制结果代码</button><a class="primary" id="returnFromClipboard" href="'+esc(shortcutURL+"&input=clipboard")+'">从剪贴板写入 Numbers</a></div>'+
    '<output class="notice" id="copyNotice" aria-live="polite"></output></div></details>'+
    '<div class="actions"><button type="button" class="secondary" id="editResult">返回修改</button><button type="button" class="secondary" id="finishResult">已写入，开始下一次</button></div></section>';
  const resultCode = document.querySelector("#resultCode");
  resultCode.value = encoded;
  const returnNotice = document.querySelector("#returnNotice");
  document.querySelector("#returnToShortcut").onclick = () => {
    returnNotice.textContent = "正在打开快捷指令。若未跳转，可展开下方的剪贴板备用方式。";
  };
  const copyNotice = document.querySelector("#copyNotice");
  let copied = false;
  document.querySelector("#copyResult").onclick = async () => {
    try {
      await navigator.clipboard.writeText(encoded);
      copied = true;
    } catch {
      resultCode.focus();
      resultCode.select();
      resultCode.setSelectionRange(0,encoded.length);
      try { copied = document.execCommand("copy"); }
      catch { copied = false; }
    }
    copyNotice.textContent = copied ? "已复制。请点击“从剪贴板写入 Numbers”。" :
      "自动复制失败。请手动全选并复制上方结果代码。";
  };
  document.querySelector("#returnFromClipboard").onclick = event => {
    if (!copied) {
      event.preventDefault();
      copyNotice.textContent = "请先点击“复制结果代码”。手动复制后可用下面的链接继续。";
      const manual = document.createElement("a");
      manual.href = event.currentTarget.href;
      manual.textContent = "我已手动复制，打开快捷指令";
      copyNotice.append(document.createElement("br"),manual);
      return;
    }
    copyNotice.textContent = "正在打开快捷指令，完成后请到 Numbers 确认。";
  };
  document.querySelector("#editResult").onclick = () => {
    shortcutResult = null;
    saveShortcutDraft();
    renderReview();
    document.querySelector("#scorePanel").scrollIntoView({block:"start"});
  };
  document.querySelector("#finishResult").onclick = () => {
    shortcutResult = null;
    learnerId = "";
    drafts.clear();
    saveShortcutDraft();
    renderReview();
    document.querySelector("#learnerName").focus();
  };
}
async function start() {
  app.innerHTML=hero("学习验收","正在加载验收数据…");
  try {
    const loaded = await load();
    if (feishu) catalog = loaded.catalog;
    if (feishu && data && data.reviewer !== loaded.reviewer) {
      drafts.clear();
      learnerId = "";
    }
    data = loaded;
    if (shortcutMode) {
      const saved = loadShortcutDraft();
      if (saved && moduleOf(saved.moduleId) && Array.isArray(saved.drafts)) {
        learnerId = saved.learnerId;
        data.reviewer = saved.reviewer;
        moduleId = saved.moduleId;
        saved.drafts.forEach(([key,value]) => drafts.set(key,value));
        shortcutResult = saved.result;
      }
    }
    render();
  }
  catch(error) {
    if (feishu && error.status === 401) return showLogin();
    const note = document.createElement("p");
    note.className = "notice error";
    note.textContent = error.message;
    const retry = document.createElement("button");
    retry.textContent = "重试";
    retry.className = "secondary";
    retry.onclick = start;
    app.append(note,retry);
  }
}
function showLogin() {
  signOut.hidden = true;
  document.querySelector("#account").textContent = "";
  app.innerHTML = hero("学习验收","输入管理员发给你的导师访问码。")+
    '<section class="section pane"><form id="mentorLogin"><label>导师访问码<input name="code" maxlength="128" type="password" autocomplete="current-password" required></label><div class="actions"><button class="primary" type="submit">进入验收</button></div><output class="notice error" id="loginNotice" aria-live="polite"></output></form></section>';
}
async function loginMentor(form) {
  pending = true;
  form.querySelector("button").disabled = true;
  try {
    await request("/api/session", {code:form.elements.code.value.trim()});
    await start();
  } catch(error) {
    document.querySelector("#loginNotice").textContent = error.message || "登录失败，请重试。";
    form.querySelector("button").disabled = false;
  } finally {
    pending = false;
    if (document.querySelector("#reviewForm")) updateReview();
  }
}
signOut.addEventListener("click",async()=>{
  if (pending) return;
  try { await request("/api/signout",{}); }
  catch(error) { return showNotice(error.message,true); }
  data = undefined;
  catalog = [];
  drafts.clear();
  learnerId = "";
  notice = "";
  showLogin();
});
start();
</script>
</body>
</html>
